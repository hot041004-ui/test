<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중학교 과학 4지선다 인터랙티브 퀴즈</title>
  <!-- Tailwind CSS & React React-DOM Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const QUIZ_DATA = [
      {
        id: 1,
        category: "물리",
        question: "다음 중 빛의 합성에서 3원색(RGB)에 해당하지 않는 색은 무엇인가요?",
        options: ["1. 빨강 (Red)", "2. 초록 (Green)", "3. 파랑 (Blue)", "4. 노랑 (Yellow)"],
        answer: 3,
        explanation: "빛의 3원색은 빨강, 초록, 파랑입니다. 노랑은 빨간색 빛과 초록색 빛을 합성했을 때 나타나는 색입니다."
      },
      {
        id: 2,
        category: "화학",
        question: "물질의 상태 변화 중 '고체에서 기체'로 직접 변하는 현상을 무엇이라고 하나요?",
        options: ["1. 응고", "2. 승화", "3. 액화", "4. 기화"],
        answer: 1,
        explanation: "고체가 액체를 거치지 않고 바로 기체로 변하거나, 반대로 기체가 고체로 변하는 현상을 '승화'라고 합니다."
      },
      {
        id: 3,
        category: "생물",
        question: "식물이 빛에너지를 이용하여 유기물을 합성하고 산소를 발생시키는 작용은?",
        options: ["1. 호흡 작용", "2. 광합성 작용", "3. 증산 작용", "4. 소화 작용"],
        answer: 1,
        explanation: "광합성은 엽록체에서 엽록소가 빛에너지를 흡수하여 물과 이산화탄소로부터 양분과 산소를 만드는 과정입니다."
      },
      {
        id: 4,
        category: "지구과학",
        question: "지구 내부 구조 중 가장 큰 부피를 차지하는 층은 어디인가요?",
        options: ["1. 지각", "2. 맨틀", "3. 외핵", "4. 내핵"],
        answer: 1,
        explanation: "맨틀은 지각 아래부터 깊이 약 2,900km까지의 부분으로, 지구 전체 부피의 약 80% 이상을 차지합니다."
      },
      {
        id: 5,
        category: "물리",
        question: "물체에 힘을 주어 힘의 방향으로 이동시켰을 때, 과학에서의 '일의 양(J)'을 구하는 공식을 옳게 나타낸 것은?",
        options: ["1. 힘의 크기 × 이동 거리", "2. 질량 × 가속도", "3. 힘의 크기 ÷ 이동 거리", "4. 질량 × 높이 ÷ 시간"],
        answer: 0,
        explanation: "과학에서 일의 양(W)은 물체에 작용하는 힘의 크기(F)와 힘의 방향으로 이동한 거리(s)의 곱으로 구합니다. (W = F × s)"
      },
      {
        id: 6,
        category: "화학",
        question: "원자가 전자를 잃거나 얻어서 전하를 띠게 된 입자를 무엇이라고 하나요?",
        options: ["1. 분자", "2. 이온", "3. 원소", "4. 화합물"],
        answer: 1,
        explanation: "중성 상태의 원자가 전자를 잃으면 양이온(+), 전자를 얻으면 음이온(-)이 됩니다."
      },
      {
        id: 7,
        category: "생물",
        question: "사람의 혈액 성분 중 체내에 침입한 병원체를 식균 작용으로 파괴하여 우리 몸을 보호하는 것은?",
        options: ["1. 적혈구", "2. 백혈구", "3. 혈소판", "4. 혈장"],
        answer: 1,
        explanation: "백혈구는 식균 작용을 하여 식균 물질 및 병원체를 제거함으로써 면역 반응을 담당합니다."
      },
      {
        id: 8,
        category: "지구과학",
        question: "달의 모양 변화 과정 중 지구에서 보았을 때 오른쪽 반만 밝게 보이는 달의 상은?",
        options: ["1. 초승달", "2. 상현달", "3. 하현달", "4. 그믐달"],
        answer: 1,
        explanation: "음력 7~8일경에 관측되며 오른쪽 반이 밝게 보이는 달은 '상현달'입니다."
      },
      {
        id: 9,
        category: "물리",
        question: "소리의 3요소(높낮이, 세기, 맵시) 중 파동의 '진동수'와 가장 직접적으로 관련된 요소는?",
        options: ["1. 소리의 크기", "2. 소리의 높낮이", "3. 소리의 맵시(음색)", "4. 소리의 속도"],
        answer: 1,
        explanation: "진동수가 많을수록(높을수록) 고음(높은 소리)이 나고, 진동수가 적을수록 저음(낮은 소리)이 납니다."
      },
      {
        id: 10,
        category: "지구과학",
        question: "대기권의 계층 중 수증기가 존재하며 기상 현상(비, 눈 등)이 발생하는 층은 어디인가요?",
        options: ["1. 대류권", "2. 성층권", "3. 중간권", "4. 열권"],
        answer: 0,
        explanation: "대류권은 공기가 밀집되어 있고 수증기가 많아 대류 운동과 함께 구름, 비, 눈 등의 기상 현상이 일어납니다."
      }
    ];

    function App() {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
      const [userResults, setUserResults] = useState([]); // 각 문제별 정답 여부 (true/false)
      const [quizFinished, setQuizFinished] = useState(false);

      const [detectedZone, setDetectedZone] = useState(0);
      const [hoveredOption, setHoveredOption] = useState(null);
      const [holdProgress, setHoldProgress] = useState(0);

      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState(false);

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const requestRef = useRef(null);
      const holdStartTimeRef = useRef(null);
      const currentHoverRef = useRef(null);
      const isSubmittedRef = useRef(false);

      useEffect(() => {
        isSubmittedRef.current = isAnswerSubmitted;
      }, [isAnswerSubmitted]);

      // 웹캠 시작
      useEffect(() => {
        let stream = null;
        const startVideo = async () => {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { width: 320, height: 240, facingMode: 'user' }
            });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.onloadedmetadata = () => {
                videoRef.current.play();
                setCameraActive(true);
                startFaceTracking();
              };
            }
          } catch (err) {
            console.error('웹캠을 열 수 없습니다:', err);
            setCameraError(true);
          }
        };

        startVideo();

        return () => {
          if (requestRef.current) cancelAnimationFrame(requestRef.current);
          if (stream) stream.getTracks().forEach(track => track.stop());
        };
      }, []);

      // 하단 4분할 피부색/얼굴 영역 트래킹
      const startFaceTracking = () => {
        const canvas = canvasRef.current || document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 120;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const processFrame = () => {
          if (videoRef.current && videoRef.current.readyState >= 2) {
            ctx.drawImage(videoRef.current, 0, 0, 160, 120);
            const frame = ctx.getImageData(0, 0, 160, 120);
            
            const activeZone = getFacePositionZone(frame.data, 160, 120);
            setDetectedZone(activeZone);

            if (!isSubmittedRef.current && activeZone >= 1 && activeZone <= 4) {
              const targetIdx = activeZone - 1;

              if (currentHoverRef.current !== targetIdx) {
                currentHoverRef.current = targetIdx;
                setHoveredOption(targetIdx);
                holdStartTimeRef.current = performance.now();
                setHoldProgress(0);
              } else {
                if (holdStartTimeRef.current) {
                  const elapsed = performance.now() - holdStartTimeRef.current;
                  const progress = Math.min((elapsed / 3000) * 100, 100); // 3초 (3000ms)
                  setHoldProgress(progress);

                  if (elapsed >= 3000) {
                    confirmAnswer(targetIdx);
                    holdStartTimeRef.current = null;
                    setHoldProgress(0);
                  }
                }
              }
            } else {
              currentHoverRef.current = null;
              setHoveredOption(null);
              holdStartTimeRef.current = null;
              setHoldProgress(0);
            }
          }
          requestRef.current = requestAnimationFrame(processFrame);
        };

        requestRef.current = requestAnimationFrame(processFrame);
      };

      // 화면 하단 4개 영역 중 피부 색상 밀집 영역 찾기 (거울모드 반영)
      const getFacePositionZone = (data, width, height) => {
        const bottomStart = Math.floor(height * 0.55);
        const zoneWidth = width / 4;
        const zones = [0, 0, 0, 0];

        for (let y = bottomStart; y < height; y += 3) {
          for (let x = 0; x < width; x += 3) {
            const i = (y * width + x) * 4;
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            if (r > 60 && g > 35 && b > 20 && r > g && r > b && Math.abs(r - g) > 10) {
              const mirroredX = width - x;
              let zoneIdx = Math.floor(mirroredX / zoneWidth);
              if (zoneIdx > 3) zoneIdx = 3;
              if (zoneIdx < 0) zoneIdx = 0;
              zones[zoneIdx]++;
            }
          }
        }

        let maxVal = 0;
        let maxZone = 0;
        zones.forEach((val, idx) => {
          if (val > maxVal) {
            maxVal = val;
            maxZone = idx + 1;
          }
        });

        return maxVal > 25 ? maxZone : 0;
      };

      // 정답 확정 및 O/X 배열에 정확하게 기록
      const confirmAnswer = (optionIdx) => {
        if (isSubmittedRef.current) return;

        setSelectedOption(optionIdx);
        setIsAnswerSubmitted(true);

        const currentAnswer = QUIZ_DATA[currentIdx].answer;
        const isCorrect = Number(optionIdx) === Number(currentAnswer);
        
        setUserResults(prev => [...prev, isCorrect]);
      };

      const handleNextQuestion = () => {
        if (currentIdx < QUIZ_DATA.length - 1) {
          setCurrentIdx(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswerSubmitted(false);
          setHoveredOption(null);
          setHoldProgress(0);
          currentHoverRef.current = null;
          holdStartTimeRef.current = null;
        }
      };

      const handleRestart = () => {
        setCurrentIdx(0);
        setSelectedOption(null);
        setIsAnswerSubmitted(false);
        setUserResults([]);
        setHoveredOption(null);
        setHoldProgress(0);
        currentHoverRef.current = null;
        holdStartTimeRef.current = null;
      };

      const currentQ = QUIZ_DATA[currentIdx];

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 md:p-8">
          {/* 상단 헤더 */}
          <header className="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 flex justify-between items-center shadow-lg">
            <div>
              <h1 className="text-xl md:text-2xl font-bold text-indigo-400">중학교 과학 4지선다 퀴즈</h1>
              <p className="text-xs md:text-sm text-slate-400">얼굴을 하단 1~4번 영역으로 이동하여 3초간 선택하세요</p>
            </div>
            <div className="text-right">
              <div className="text-sm font-semibold text-indigo-300">진행 상황</div>
              <div className="text-xs text-slate-400">{currentIdx + 1} / {QUIZ_DATA.length} 문제</div>
            </div>
          </header>

          {/* 메인 퀴즈 콘텐츠 */}
          <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            {/* 좌측: 웹캠 트래킹 화면 */}
            <section className="lg:col-span-4 bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-xl">
              <h2 className="text-sm font-semibold mb-3 text-slate-300 text-center">실시간 웹캠 감지</h2>
              
              <div className="relative aspect-video bg-slate-950 rounded-xl overflow-hidden border border-slate-700">
                <video
                  ref={videoRef}
                  className="w-full h-full object-cover scale-x-[-1]"
                  playsInline
                  muted
                />

                {/* 하단 4분할 화면 오버레이 가이드 */}
                {cameraActive && (
                  <div className="absolute inset-x-0 bottom-0 h-[45%] border-t-2 border-dashed border-indigo-400/50 bg-indigo-900/10 grid grid-cols-4 pointer-events-none">
                    {[1, 2, 3, 4].map(num => (
                      <div
                        key={num}
                        className={`border-r last:border-r-0 border-indigo-400/30 flex items-center justify-center font-bold text-lg transition-colors ${
                          detectedZone === num ? 'bg-indigo-500/50 text-white' : 'text-slate-300/60'
                        }`}
                      >
                        {num}번
                      </div>
                    ))}
                  </div>
                )}

                {cameraError && (
                  <div className="absolute inset-0 flex items-center justify-center p-4 bg-slate-950/90 text-center text-xs text-rose-400">
                    카메라를 연결할 수 없습니다.<br/>마우스로 보기를 선택하세요.
                  </div>
                )}
              </div>

              <div className="mt-4 text-center text-xs text-slate-300 font-medium">
                인식 상태: {detectedZone > 0 ? <span className="text-indigo-400 font-bold">{detectedZone}번 영역 감지 중</span> : '대기 중'}
              </div>
            </section>

            {/* 우측: 문제 및 보기 카드 */}
            <section className="lg:col-span-8">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <div className="inline-block bg-indigo-600/30 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full mb-3 border border-indigo-500/30">
                  {currentQ.category}
                </div>

                <h2 className="text-xl md:text-2xl font-bold mb-6 text-white leading-snug">
                  Q{currentQ.id}. {currentQ.question}
                </h2>

                {/* 4지선다 보기 버튼 목록 */}
                <div className="space-y-3 mb-6">
                  {currentQ.options.map((opt, idx) => {
                    const isHovered = hoveredOption === idx;
                    const isSelected = selectedOption === idx;
                    const isCorrect = currentQ.answer === idx;

                    let btnStyle = "bg-slate-700/40 border-slate-600 text-slate-200 hover:bg-slate-700";

                    if (isAnswerSubmitted) {
                      if (isCorrect) {
                        btnStyle = "bg-emerald-600/30 border-emerald-500 text-emerald-200 font-bold";
                      } else if (isSelected && !isCorrect) {
                        btnStyle = "bg-rose-600/30 border-rose-500 text-rose-200";
                      } else {
                        btnStyle = "bg-slate-800/40 border-slate-700 text-slate-500 opacity-50";
                      }
                    } else if (isHovered) {
                      btnStyle = "bg-indigo-600/40 border-indigo-400 text-white shadow-lg scale-[1.01]";
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => confirmAnswer(idx)}
                        disabled={isAnswerSubmitted}
                        className={`relative w-full p-4 rounded-xl border text-left font-medium text-lg transition-all overflow-hidden ${btnStyle}`}
                      >
                        <span className="relative z-10">{opt}</span>

                        {/* 3초 홀드 진행바 애니메이션 */}
                        {!isAnswerSubmitted && isHovered && (
                          <div
                            className="absolute left-0 top-0 bottom-0 bg-indigo-500/40 transition-all duration-100 ease-linear"
                            style={{ width: `${holdProgress}%` }}
                          />
                        )}
                      </button>
                    );
                  })}
                </div>

                {/* 정답 및 해설 출력 */}
                {isAnswerSubmitted && (
                  <div className="bg-slate-900/90 border border-slate-700 rounded-xl p-4 mb-6">
                    <div className="font-bold text-sm text-indigo-400 mb-1">💡 정답 해설</div>
                    <p className="text-sm text-slate-300">{currentQ.explanation}</p>
                  </div>
                )}

                {/* 하단 버튼 (다음 문제 또는 다시 풀어보기) */}
                {isAnswerSubmitted && (
                  <div className="flex justify-end">
                    {currentIdx < QUIZ_DATA.length - 1 ? (
                      <button
                        onClick={handleNextQuestion}
                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition"
                      >
                        다음 문제 👉
                      </button>
                    ) : (
                      <button
                        onClick={handleRestart}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition"
                      >
                        처음부터 다시 풀기 🔄
                      </button>
                    )}
                  </div>
                )}
              </div>
            </section>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
