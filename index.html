<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중학교 과학 스마트 퀴즈</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (Production CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const QUIZ_DATA = [
      {
        id: 1,
        category: "물리",
        question: "다음 중 빛의 합성에서 3원색(RGB)에 해당하지 않는 색은 무엇인가요?",
        options: ["빨강 (Red)", "초록 (Green)", "파랑 (Blue)", "노랑 (Yellow)"],
        answer: 3,
        explanation: "빛의 3원색은 빨강, 초록, 파랑입니다. 노랑은 빨간색 빛과 초록색 빛을 합성했을 때 나타나는 색입니다."
      },
      {
        id: 2,
        category: "화학",
        question: "물질의 상태 변화 중 '고체에서 기체'로 직접 변하는 현상을 무엇이라고 하나요?",
        options: ["응고", "승화", "액화", "기화"],
        answer: 1,
        explanation: "고체가 액체를 거치지 않고 바로 기체로 변하거나, 반대로 기체가 고체로 변하는 현상을 '승화'라고 합니다."
      },
      {
        id: 3,
        category: "생물",
        question: "식물이 빛에너지를 이용하여 유기물을 합성하고 산소를 발생시키는 작용은?",
        options: ["호흡 작용", "광합성 작용", "증산 작용", "소화 작용"],
        answer: 1,
        explanation: "광합성은 엽록체에서 엽록소가 빛에너지를 흡수하여 물과 이산화탄소로부터 양분과 산소를 만드는 과정입니다."
      },
      {
        id: 4,
        category: "지구과학",
        question: "지구 내부 구조 중 가장 큰 부피를 차지하는 층은 어디인가요?",
        options: ["지각", "맨틀", "외핵", "내핵"],
        answer: 1,
        explanation: "맨틀은 지각 아래부터 깊이 약 2,900km까지의 부분으로, 지구 전체 부피의 약 80% 이상을 차지합니다."
      },
      {
        id: 5,
        category: "물리",
        question: "물체에 힘을 주어 힘의 방향으로 이동시켰을 때, 과학에서의 '일의 양(J)'을 구하는 공식은?",
        options: ["힘의 크기 × 이동 거리", "질량 × 가속도", "힘의 크기 ÷ 이동 거리", "질량 × 높이 ÷ 시간"],
        answer: 0,
        explanation: "과학에서 일의 양(W)은 물체에 작용하는 힘의 크기(F)와 이동한 거리(s)의 곱(W = F × s)으로 구합니다."
      },
      {
        id: 6,
        category: "화학",
        question: "원자가 전자를 잃거나 얻어서 전하를 띠게 된 입자를 무엇이라고 하나요?",
        options: ["분자", "이온", "원소", "화합물"],
        answer: 1,
        explanation: "중성 원자가 전자를 잃으면 양이온(+), 전자를 얻으면 음이온(-)이 됩니다."
      },
      {
        id: 7,
        category: "생물",
        question: "사람의 혈액 성분 중 체내에 침입한 병원체를 식균 작용으로 파괴하는 것은?",
        options: ["적혈구", "백혈구", "혈소판", "혈장"],
        answer: 1,
        explanation: "백혈구는 식균 작용을 통해 침입한 균과 이물질을 파괴하여 우리 몸을 보호합니다."
      },
      {
        id: 8,
        category: "지구과학",
        question: "달의 모양 변화 중 오른쪽 반만 밝게 보이는 달의 상은?",
        options: ["초승달", "상현달", "하현달", "그믐달"],
        answer: 1,
        explanation: "음력 7~8일경 관측되며 오른쪽 반이 밝게 보이는 달을 상현달이라고 합니다."
      },
      {
        id: 9,
        category: "물리",
        question: "소리의 3요소 중 파동의 '진동수'와 가장 직접적으로 관련된 요소는?",
        options: ["소리의 크기", "소리의 높낮이", "소리의 맵시(음색)", "소리의 속도"],
        answer: 1,
        explanation: "진동수가 많을수록 높은 소리가 나고, 진동수가 적을수록 낮은 소리가 납니다."
      },
      {
        id: 10,
        category: "지구과학",
        question: "대기권 중 수증기가 존재하며 비, 눈 등 기상 현상이 발생하는 층은?",
        options: ["대류권", "성층권", "중간권", "열권"],
        answer: 0,
        explanation: "대류권은 대부분의 수증기가 포함되어 있어 대류 운동에 의한 기상 현상이 발생합니다."
      }
    ];

    function App() {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [quizFinished, setQuizFinished] = useState(false);

      const [detectedZone, setDetectedZone] = useState(0);
      const [hoveredOption, setHoveredOption] = useState(null);
      const [holdProgress, setHoldProgress] = useState(0);

      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState(null);

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const prevFrameRef = useRef(null);
      const requestRef = useRef(null);
      const holdStartTimeRef = useRef(null);
      const currentHoverRef = useRef(null);
      const isSubmittedRef = useRef(false);

      useEffect(() => {
        isSubmittedRef.current = isAnswerSubmitted;
      }, [isAnswerSubmitted]);

      useEffect(() => {
        startCamera();
        return () => stopCamera();
      }, []);

      const startCamera = async () => {
        setCameraError(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 320, height: 240, facingMode: "user" }
          });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.onloadedmetadata = () => {
              videoRef.current.play();
              setCameraActive(true);
              startMotionDetection();
            };
          }
        } catch (err) {
          setCameraActive(false);
          setCameraError("카메라를 연결할 수 없거나 권한이 거부되었습니다. 보기를 마우스/터치로 눌러 퀴즈를 진행하세요.");
        }
      };

      const stopCamera = () => {
        if (requestRef.current) cancelAnimationFrame(requestRef.current);
        if (videoRef.current && videoRef.current.srcObject) {
          const stream = videoRef.current.srcObject;
          stream.getTracks().forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
        setCameraActive(false);
      };

      const startMotionDetection = () => {
        const canvas = canvasRef.current || document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 120;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const processFrame = () => {
          if (videoRef.current && videoRef.current.readyState >= 2) {
            ctx.drawImage(videoRef.current, 0, 0, 160, 120);
            const frame = ctx.getImageData(0, 0, 160, 120);

            if (prevFrameRef.current) {
              const activeZone = getActiveZone(frame.data, prevFrameRef.current.data, 160, 120);
              setDetectedZone(activeZone);

              if (!isSubmittedRef.current && activeZone >= 1 && activeZone <= 4) {
                const targetIdx = activeZone - 1;
                if (currentHoverRef.current !== targetIdx) {
                  currentHoverRef.current = targetIdx;
                  setHoveredOption(targetIdx);
                  holdStartTimeRef.current = performance.now();
                  setHoldProgress(0);
                } else {
                  if (holdStartTimeRef.current) {
                    const elapsed = performance.now() - holdStartTimeRef.current;
                    const progress = Math.min((elapsed / 1500) * 100, 100);
                    setHoldProgress(progress);

                    if (elapsed >= 1500) {
                      confirmAnswer(targetIdx);
                      holdStartTimeRef.current = null;
                      setHoldProgress(0);
                    }
                  }
                }
              } else {
                currentHoverRef.current = null;
                setHoveredOption(null);
                holdStartTimeRef.current = null;
                setHoldProgress(0);
              }
            }
            prevFrameRef.current = frame;
          }
          requestRef.current = requestAnimationFrame(processFrame);
        };
        requestRef.current = requestAnimationFrame(processFrame);
      };

      const getActiveZone = (curr, prev, width, height) => {
        const zones = [0, 0, 0, 0];
        const halfW = width / 2;
        const halfH = height / 2;

        for (let y = 0; y < height; y += 4) {
          for (let x = 0; x < width; x += 4) {
            const i = (y * width + x) * 4;
            const rDiff = Math.abs(curr[i] - prev[i]);
            const gDiff = Math.abs(curr[i + 1] - prev[i + 1]);
            const bDiff = Math.abs(curr[i + 2] - prev[i + 2]);

            if (rDiff + gDiff + bDiff > 35) {
              const mirroredX = width - x;
              let zoneIdx = 0;
              if (mirroredX < halfW && y < halfH) zoneIdx = 0;
              else if (mirroredX >= halfW && y < halfH) zoneIdx = 1;
              else if (mirroredX < halfW && y >= halfH) zoneIdx = 2;
              else zoneIdx = 3;

              zones[zoneIdx]++;
            }
          }
        }

        let maxVal = 0;
        let maxZone = 0;
        zones.forEach((val, idx) => {
          if (val > maxVal) {
            maxVal = val;
            maxZone = idx + 1;
          }
        });

        return maxVal > 15 ? maxZone : 0;
      };

      const confirmAnswer = (optionIdx) => {
        if (isAnswerSubmitted) return;
        setSelectedOption(optionIdx);
        setIsAnswerSubmitted(true);

        if (optionIdx === QUIZ_DATA[currentIdx].answer) {
          setScore(prev => prev + 10);
        }
      };

      const handleNextQuestion = () => {
        if (currentIdx < QUIZ_DATA.length - 1) {
          setCurrentIdx(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswerSubmitted(false);
          setHoveredOption(null);
          setHoldProgress(0);
          currentHoverRef.current = null;
          holdStartTimeRef.current = null;
        } else {
          setQuizFinished(true);
        }
      };

      const handleRestart = () => {
        setCurrentIdx(0);
        setSelectedOption(null);
        setIsAnswerSubmitted(false);
        setScore(0);
        setQuizFinished(false);
        setHoveredOption(null);
        setHoldProgress(0);
        currentHoverRef.current = null;
        holdStartTimeRef.current = null;
      };

      const currentQ = QUIZ_DATA[currentIdx];

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-slate-800/90 border-b border-slate-700 sticky top-0 z-50 p-4">
            <div className="max-w-5xl mx-auto flex justify-between items-center">
              <h1 className="text-xl font-bold text-indigo-400">중학교 과학 스마트 퀴즈</h1>
              <div className="flex gap-4 items-center">
                <span className="text-amber-400 font-extrabold text-lg">{score}점</span>
                <span className="bg-slate-700 text-xs px-2.5 py-1 rounded-md">{currentIdx + 1} / {QUIZ_DATA.length}</span>
              </div>
            </div>
          </header>

          <main className="max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6 flex-1">
            <div className="md:col-span-5 flex flex-col gap-3">
              <div className="bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-col items-center">
                <div className="w-full text-xs text-slate-400 mb-2 flex justify-between">
                  <span>모션 감지 웹캠</span>
                  <span className={cameraActive ? "text-emerald-400 font-bold" : "text-rose-400"}>
                    {cameraActive ? "● 동작 중" : "비활성"}
                  </span>
                </div>

                <div className="relative w-full aspect-video bg-slate-950 rounded-lg overflow-hidden border border-slate-700">
                  <video ref={videoRef} className="w-full h-full object-cover scale-x-[-1]" playsInline muted />
                  
                  {cameraActive && (
                    <div className="absolute top-2 left-2 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-700 text-xs text-indigo-300">
                      감지 상태: <span className="font-bold text-white text-sm">{detectedZone > 0 ? `${detectedZone}번 영역 감지 중` : '대기 중'}</span>
                    </div>
                  )}

                  {cameraActive && (
                    <div className="absolute inset-0 grid grid-cols-2 grid-rows-2 pointer-events-none opacity-40">
                      <div className="border border-dashed border-indigo-400/50 flex items-center justify-center font-bold text-indigo-300 text-lg">1</div>
                      <div className="border border-dashed border-indigo-400/50 flex items-center justify-center font-bold text-indigo-300 text-lg">2</div>
                      <div className="border border-dashed border-indigo-400/50 flex items-center justify-center font-bold text-indigo-300 text-lg">3</div>
                      <div className="border border-dashed border-indigo-400/50 flex items-center justify-center font-bold text-indigo-300 text-lg">4</div>
                    </div>
                  )}
                </div>

                {cameraError && (
                  <p className="mt-2 text-xs text-amber-300 bg-amber-500/10 p-2 rounded border border-amber-500/20">{cameraError}</p>
                )}

                <div className="w-full mt-3 bg-slate-900/50 p-3 rounded text-xs text-slate-400 space-y-1">
                  <p className="text-indigo-300 font-semibold">💡 동작 조작법</p>
                  <p>화면 1, 2, 3, 4번 영역으로 손을 가져가서 <strong className="text-amber-400">1.5초간 계시면</strong> 답안으로 자동 선택됩니다.</p>
                </div>
              </div>
            </div>

            <div className="md:col-span-7 flex flex-col">
              {!quizFinished ? (
                <div className="bg-slate-800 border border-slate-700 p-6 rounded-xl flex-1 flex flex-col justify-between">
                  <div>
                    <div className="text-xs bg-indigo-500/20 text-indigo-300 inline-block px-2.5 py-1 rounded-full mb-3">
                      {currentQ.category}
                    </div>
                    <h2 className="text-xl font-bold text-white mb-6">Q{currentQ.id}. {currentQ.question}</h2>

                    <div className="space-y-3 mb-6">
                      {currentQ.options.map((opt, idx) => {
                        const isHovered = hoveredOption === idx;
                        const isSelected = selectedOption === idx;
                        const isCorrect = currentQ.answer === idx;

                        let style = "bg-slate-700/40 border-slate-600 text-slate-200 hover:bg-slate-700/80";
                        if (isAnswerSubmitted) {
                          if (isCorrect) style = "bg-emerald-500/20 border-emerald-500 text-emerald-200 font-bold";
                          else if (isSelected) style = "bg-rose-500/20 border-rose-500 text-rose-200";
                          else style = "bg-slate-800/40 border-slate-700 text-slate-500 opacity-50";
                        } else if (isHovered) {
                          style = "bg-indigo-600/30 border-indigo-400 text-white scale-[1.01]";
                        }

                        return (
                          <button
                            key={idx}
                            onClick={() => confirmAnswer(idx)}
                            disabled={isAnswerSubmitted}
                            className={`relative w-full p-4 rounded-xl border text-left flex justify-between items-center transition-all ${style}`}
                          >
                            <span className="font-medium z-10"><strong className="mr-2 text-indigo-400">{idx + 1}.</strong> {opt}</span>
                            {!isAnswerSubmitted && isHovered && (
                              <div className="absolute left-0 top-0 bottom-0 bg-indigo-500/20 rounded-xl" style={{ width: `${holdProgress}%` }} />
                            )}
                          </button>
                        );
                      })}
                    </div>

                    {isAnswerSubmitted && (
                      <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-sm">
                        <p className="font-semibold text-indigo-400 mb-1">정답 해설</p>
                        <p className="text-slate-300 text-xs md:text-sm">{currentQ.explanation}</p>
                      </div>
                    )}
                  </div>

                  {isAnswerSubmitted && (
                    <button
                      onClick={handleNextQuestion}
                      className="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl self-end transition"
                    >
                      {currentIdx < QUIZ_DATA.length - 1 ? "다음 문제" : "결과 보기"}
                    </button>
                  )}
                </div>
              ) : (
                <div className="bg-slate-800 border border-slate-700 p-8 rounded-xl text-center flex-1 flex flex-col items-center justify-center">
                  <h2 className="text-2xl font-bold text-white mb-2">퀴즈 종료!</h2>
                  <p className="text-4xl font-extrabold text-amber-400 mb-6">{score}점</p>
                  <button
                    onClick={handleRestart}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl transition"
                  >
                    다시 도전하기
                  </button>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
